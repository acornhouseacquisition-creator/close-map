<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Property Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{--ink:#11151a;--card:rgba(17,21,26,.92);--line:rgba(255,255,255,.12);--muted:#9aa4af;--accent:#2f81f7;--pin:#e5484d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
  #map{position:absolute;inset:0;background:#2b3a2a}
  .card{position:absolute;left:16px;top:16px;z-index:500;width:360px;max-width:calc(100% - 32px);background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden}
  .card .top{padding:16px 18px 12px}
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#ffd166;background:rgba(255,209,102,.12);padding:3px 8px;border-radius:999px;margin-bottom:8px}
  h1{margin:0;font-size:19px;line-height:1.3}
  .sub{margin-top:4px;font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.primary{background:var(--accent);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.1)}
  .row{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
  .row .btn{flex:1;font-weight:500;font-size:12px}
  .layers{position:absolute;right:16px;top:16px;z-index:500;display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .layers button{background:none;border:0;color:#cfd6dd;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .layers button.on{background:var(--accent);color:#fff}
  .pin{width:34px;height:34px;border-radius:50% 50% 50% 0;background:var(--pin);transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.5)}
  .pin::after{content:"";position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;left:9px;top:9px}
  .pulse{width:70px;height:70px;border-radius:50%;background:rgba(229,72,77,.35);animation:p 1.8s ease-out infinite}
  @keyframes p{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
  .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:400;color:var(--muted);font-size:15px;pointer-events:none}
  .toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:600;background:#fff;color:#111;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .leaflet-control-attribution{font-size:10px}
  .leaflet-tile-container img{width:256.6px!important;height:256.6px!important} /* hide seams between tiles */
  @media (max-width:600px){.card{top:auto;bottom:16px}.layers{top:16px}.leaflet-control-zoom{display:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="msg" id="msg">Finding the house…</div>

<div class="card">
  <div class="top">
    <span class="tag" id="status" hidden></span>
    <h1 id="street">Property</h1>
    <div class="sub" id="city"></div>
  </div>
  <div class="grid">
    <a class="btn primary" id="sv" target="_blank" rel="noopener">🚶 Street View</a>
    <a class="btn" id="gm" target="_blank" rel="noopener">🗺 Google Maps</a>
    <a class="btn" id="zl" target="_blank" rel="noopener">🏠 Zillow</a>
    <a class="btn" id="pw" target="_blank" rel="noopener">🏠 Propwire</a>
  </div>
  <div class="row">
    <a class="btn" id="dir" target="_blank" rel="noopener">🚗 Directions</a>
    <button class="btn" id="copy">📋 Copy address</button>
    <button class="btn" id="recenter">🎯 Re-center</button>
  </div>
</div>

<div class="layers">
  <button data-l="sat" class="on">Satellite</button>
  <button data-l="hyb">Hybrid</button>
  <button data-l="map">Map</button>
</div>
<div class="toast" id="toast">Copied</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// Address comes in the URL hash (#a=...&s=...) so it never reaches any server log
const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
const addr = (params.get('a') || '').trim();
const status = (params.get('s') || '').replace(/^[^\w$]+/u, '').trim();
const $ = (id) => document.getElementById(id);
const enc = encodeURIComponent;

const esri = (s) => `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
const sat = L.tileLayer(esri('World_Imagery'), { maxNativeZoom: 19, maxZoom: 21, attribution: 'Imagery © Esri' });
const labels = L.tileLayer(esri('Reference/World_Transportation'), { maxNativeZoom: 19, maxZoom: 21 });
const names = L.tileLayer(esri('Reference/World_Boundaries_and_Places'), { maxNativeZoom: 19, maxZoom: 21 });
const street = L.tileLayer(esri('World_Street_Map'), { maxNativeZoom: 19, maxZoom: 21, attribution: '© Esri' });
const map = L.map('map', { zoomControl: false, layers: [sat] }).setView([39.5, -81], 6);
L.control.zoom({ position: 'bottomright' }).addTo(map);

const layerSets = { sat: [sat], hyb: [sat, labels, names], map: [street] };
document.querySelectorAll('.layers button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.layers button').forEach((x) => x.classList.toggle('on', x === b));
  [sat, labels, names, street].forEach((l) => map.removeLayer(l));
  layerSets[b.dataset.l].forEach((l) => l.addTo(map));
});

function fill() {
  const [first, ...rest] = addr.split(',');
  $('street').textContent = first || 'No address';
  $('city').textContent = rest.join(',').trim();
  document.title = (first || 'Property') + ' · Map';
  if (status) { $('status').textContent = status; $('status').hidden = false; }
  $('gm').href = `https://www.google.com/maps/search/?api=1&query=${enc(addr)}`;
  $('zl').href = `https://www.zillow.com/homes/${enc(addr).replace(/%20/g, '-')}_rb/`;
  $('pw').href = `https://propwire.com/search?q=${enc(addr)}`;
  $('dir').href = `https://www.google.com/maps/dir/?api=1&destination=${enc(addr)}`;
  $('sv').href = $('gm').href;
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(addr); } catch (e) { /* older browsers */ }
    $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 1200);
  };
}

async function geocode() {
  const r = await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&countryCode=USA&singleLine=' + enc(addr));
  const c = (await r.json()).candidates?.[0];
  return c && c.score >= 80 ? [c.location.y, c.location.x] : null;
}

(async () => {
  fill();
  if (!addr) { $('msg').textContent = 'No address was passed to this page.'; return; }
  let pt = null;
  try { pt = await geocode(); } catch (e) { /* shown below */ }
  if (!pt) { $('msg').textContent = 'Could not find this address on the map.'; return; }
  $('msg').remove();
  $('sv').href = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${pt[0]},${pt[1]}`;
  L.marker(pt, { icon: L.divIcon({ className: '', html: '<div class="pulse"></div>', iconSize: [70, 70], iconAnchor: [35, 35] }), interactive: false }).addTo(map);
  L.marker(pt, { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [34, 34], iconAnchor: [17, 40] }) }).addTo(map);
  // Keep the pin out from under the info card: right of it on desktop, above it on phones
  const centre = () => {
    const card = document.querySelector('.card');
    const phone = innerWidth <= 600;
    const shift = phone ? L.point(0, card.offsetHeight / 2) : L.point(-(card.offsetWidth + 16) / 2, 0);
    return map.unproject(map.project(pt, 19).add(shift).round(), 19);
  };
  map.flyTo(centre(), 19, { duration: 1.6 });
  $('recenter').onclick = () => map.flyTo(centre(), 19, { duration: 0.8 });
})();
</script>
</body>
</html>
